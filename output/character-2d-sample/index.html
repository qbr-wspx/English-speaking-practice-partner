<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A 哑光版 · 2D 表情小样</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#263c56;font-family:"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:28px 32px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:22px}h1{font-size:26px;margin:0 0 9px;font-weight:650}p{margin:0;color:#62738a;font-size:14px;line-height:1.7}nav{display:flex;gap:8px;flex-shrink:0}button{font:inherit;font-size:14px;padding:10px 18px;background:white;border:1px solid #c7d4e2;border-radius:8px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#264d73;color:white;border-color:#264d73}button:focus-visible{outline:3px solid #43a5d5;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}article{background:white;border:1px solid #d9e1ed;border-radius:12px;overflow:hidden}article>div{padding:16px 18px;border-bottom:1px solid #e4eaf1}h2{font-size:18px;margin:0 0 4px}article p{font-size:12px}.portrait{display:block;width:100%;height:auto;aspect-ratio:820/1000;background:#eef2f9}.zoom .portrait{aspect-ratio:340/300}footer{margin-top:18px;display:flex;gap:24px;justify-content:space-between;align-items:flex-start}footer p{max-width:80ch}a{color:#285c86}#status{font-size:13px;white-space:nowrap;color:#64768b}@media(max-width:760px){main{padding:20px 14px}header{align-items:flex-start;flex-direction:column}.grid{gap:8px}article>div{padding:10px}h2{font-size:15px}article p{font-size:11px}footer{flex-direction:column}}
</style></head><body><main><header><div><h1>A 哑光版 · 2D 表情小样</h1><p>先确认眼睛与嘴巴的画法，再继续制作动画和语音口型。</p></div><nav aria-label="查看范围"><button aria-pressed="true" data-view="half">半身对比</button><button aria-pressed="false" data-view="face">放大看脸</button></nav></header><section class="grid" id="comparison"></section><footer><p>三栏都以你的原图为底图。闭眼栏只覆盖两处眼睛，张嘴栏只覆盖嘴巴；脸型、鼻子、头发、衣服和其他区域仍直接使用原画。<br>这是局部表情素材小样，尚未更改正式应用。</p><span id="status" role="status">等待确认</span></footer></main>
<script>
const states=[['原图','保持原来的自然表情','original'],['闭眼','自然眨眼的闭合瞬间','blink'],['张嘴','轻声说话时的小幅开口','mouth']];
const original='<image href="original.png" width="1312" height="1199"/>';
const eyeMask='<rect x="330" y="293" width="97" height="63" rx="15"/><rect x="477" y="247" width="92" height="65" rx="15"/>';
const mouthMask='<rect x="437" y="377" width="72" height="45" rx="13"/>';
comparison.innerHTML=states.map(([title,description,state])=>`<article data-state="${state}"><div><h2>${title}</h2><p>${description}</p></div><svg class="portrait" viewBox="0 0 820 1000" role="img" aria-label="${title}半身人物"><defs><filter id="edge-${state}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.2"/></filter><mask id="mask-${state}" maskUnits="userSpaceOnUse" x="0" y="0" width="1312" height="1199"><g fill="white" filter="url(#edge-${state})">${state==='blink'?eyeMask:mouthMask}</g></mask></defs>${original}${state==='original'?'':`<image href="${state}-source.png" width="1312" height="1199" mask="url(#mask-${state})"/>`}</svg></article>`).join('');
for(const button of document.querySelectorAll('[data-view]'))button.addEventListener('click',()=>{const zoom=button.dataset.view==='face';document.body.classList.toggle('zoom',zoom);document.querySelectorAll('.portrait').forEach(svg=>svg.setAttribute('viewBox',zoom?'290 185 320 300':'0 0 820 1000'));document.querySelectorAll('[data-view]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));});
Promise.all(['original.png','blink-source.png','mouth-source.png'].map(src=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve();image.onerror=reject;image.src=src;}))).then(()=>{window.sampleReady=true;document.getElementById('status').textContent='三种状态已加载 · 等待确认';}).catch(()=>{document.getElementById('status').textContent='素材加载失败，请保留同目录的三张 PNG 图片';});
</script></body></html>
